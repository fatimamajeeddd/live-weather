<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <body>
  <div id="rain"></div>
  <div id="sky"></div>

  <div class="wrap">
    <header>
      <h1>Weather Dashboard</h1>
      <p>Search any city for live weather.</p>
    </header>

    <form id="searchForm" autocomplete="off" action="javascript:void(0);">
  <input type="text" id="cityInput" name="city_search" placeholder="Search a city, e.g. Lahore" required>
  <button type="submit">Search</button>
</form>

    <p class="status" id="status"></p>

    <div class="weather-card" id="weatherCard">
      <p class="place" id="placeName"></p>
      <p class="temp" id="tempNow"></p>
      <p class="desc" id="descNow"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
